# Minimal Jekyll config. Turns Jekyll processing back on (removes .nojekyll
# instead) and declares the one collection this repo adds on top of Jekyll's
# built-in `_posts`. See docs/decisions/0001-enable-jekyll-for-content-listings.md.

# Posts get the same stable, non-dated shape as projects: /posts/<slug>/,
# rather than Jekyll's dated default. The old dated URLs stop resolving; see
# docs/decisions/0004-give-posts-a-stable-non-dated-permalink.md.
permalink: /posts/:title/

collections:
  projects:
    output: true
    permalink: /projects/:path/
  # One stub file per tag currently in use (see docs/research/tag-pages.md
  # and ADR 0002) - the mechanism can't stop a stub outliving its tag, so:
  # delete a tag's stub file in the same commit that removes its last tagged entry,
  # or the tag keeps a real, empty page nothing else catches.
  tags:
    output: true
    permalink: /tags/:path/

# _posts is built-in and already output: true; no declaration needed.

# A content file with unparseable front matter must fail the build, not be
# skipped with a warning. Jekyll's default is to log the YAML error and carry
# on with exit 0, which would let a broken project or post silently vanish
# from every listing while the gate stayed green. See tests/check.sh's
# negative front-matter check, and issue #17's second acceptance criterion.
strict_front_matter: true

# What Jekyll must not treat as site content.
#
# This repository holds its own documentation - ADRs, research, design notes -
# alongside the site it publishes. GitHub Pages does not build the way a plain
# `jekyll build` does: it runs the `github-pages` gem, which loads
# jekyll-optional-front-matter, and that turns every .md in the repository into
# a page and renders it through Liquid.
#
# That is how the site broke. docs/research/tag-pages.md quotes Liquid in its
# code samples, including an excerpt with an `{% if %}` and no `{% endif %}` -
# correct as an illustration, fatal when executed. Pages parsed it as a
# template and every deployment failed from that merge onward, while the local
# build, which has no such plugin, copied the file through untouched and stayed
# green. Eight merges deployed nothing.
#
# Excluding these is the fix and also what we wanted anyway: repository
# documentation is not site content, and it was being published at
# /docs/decisions/... under a default theme nobody chose. Prose is free to
# quote Liquid again because nothing renders it.
exclude:
  - docs
  - tests
  - CLAUDE.md
  - README.md
