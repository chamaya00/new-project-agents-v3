name: guard

# Thin caller. Keeps repo memory inside its cap and keeps agents out of the
# files that gate the repo.
#
# Pinned to a release by commit SHA, like the other callers. See ci.yml for why.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    uses: chamaya00/agent-factory/.github/workflows/project-guard.yml@3151094081a7059a4f469b2742fccc57530197aa # v1.24.0
