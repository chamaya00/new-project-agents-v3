name: agent-run

# Thin caller. One agent at a time, queued at the repo level by the factory
# workflow, capped in turns and minutes.
#
# Pinned to a release, like the other callers. See ci.yml for why.
#
# Requires the repository secret CLAUDE_CODE_OAUTH_TOKEN. The App id and key
# are optional but strongly preferred: without them, pull requests land in an
# approval-required state and every one has to be approved by hand.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  # A merge is a wake. The researcher and the designer push a branch and a
  # human merges it later, so an objective learns a child finished but never
  # that its work landed - and landing is what makes the next child ready.
  # The factory workflow handles this event in its own job and refuses to
  # spend a run on the pull request itself.
  pull_request:
    types: [closed]
  # Nothing ever noticed that nothing was happening. Every fault this system
  # has had looked the same from outside: an issue correctly labelled, no run
  # against it, and no log saying so. The factory workflow uses this tick to
  # say so out loud; it re-queues nothing.
  #
  # Twice a day, not forty-eight times. What this tick catches is work that
  # is stuck, and stuck work stays stuck - the gap between hearing in thirty
  # minutes and hearing in twelve hours is nearly nothing when a person
  # checks in a few times a day, and during a session that person is watching
  # anyway. The tight cadence bought the least exactly when it fired most.
  #
  # An event would be better than any poll: no cost while nothing happens,
  # and immediate when something does. `check_suite` was the candidate and it
  # does not work here - the probe in #61 registered on the default branch,
  # three check suites completed on the commit that armed it, and it ran zero
  # times, because check suites raised by Actions do not start runs. Until
  # something replaces it, this poll is the whole of the coverage, which is
  # the other reason not to make it expensive.
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      issue-number:
        description: Issue to work.
        required: true
        type: string

jobs:
  agent:
    uses: chamaya00/agent-factory/.github/workflows/agent-run.yml@v1.18.1
    with:
      issue-number: ${{ inputs.issue-number || '' }}
      max-turns: 80
      timeout-minutes: 30
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      app-id: ${{ secrets.AGENT_APP_ID }}
      app-private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
