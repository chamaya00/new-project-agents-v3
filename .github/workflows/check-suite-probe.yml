name: check-suite-probe

# TEMPORARY. Delete once it has answered its question.
#
# Does a completed check suite start a workflow run here, and specifically
# does the one the site deployment produces?
#
# This matters because the factory wants to notice a failed deployment the
# moment it happens rather than by polling every thirty minutes, and an event
# is the cheapest possible way to do that - it costs nothing when nothing is
# deploying. But events raised by the default token deliberately do not start
# runs, which is the same recursion guard that made the agent App mandatory.
# Whether that guard also swallows a deployment's check suite is not something
# to assume: a watchdog that silently never fires is worse than the poll it
# replaced, because it looks like coverage.
#
# So this logs what actually arrives. A run of this workflow naming the
# deployment app is the answer; no run at all is also the answer.

on:
  check_suite:
    types: [completed]

jobs:
  probe:
    name: what fired
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say what arrived
        env:
          # Through the environment rather than into the script, so a branch
          # name is data instead of something the shell gets to interpret.
          BRANCH: ${{ github.event.check_suite.head_branch }}
          SHA: ${{ github.event.check_suite.head_sha }}
          CONCLUSION: ${{ github.event.check_suite.conclusion }}
          APP: ${{ github.event.check_suite.app.slug }}
        run: |
          echo "app:        $APP"
          echo "branch:     $BRANCH"
          echo "sha:        $SHA"
          echo "conclusion: $CONCLUSION"
