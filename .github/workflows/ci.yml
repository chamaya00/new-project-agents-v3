name: ci

# Thin caller: the logic lives in the factory, at the release pinned below.
#
# The pin is the point. This repository keeps running that exact release until
# somebody bumps the line and merges it - a new release in the factory changes
# nothing here on its own. `/update-agents` proposes the bump as a pull
# request, so the diff gets read here before it runs here.
#
# ---------------------------------------------------------------------------
# This is the real gate. It replaced the provisioning placeholder in the same
# sitting that the stack landed, which is what the placeholder's own comment
# asked for.
#
# It stays on the `commands` path rather than the Node path, and that is not a
# stopgap. There is no package.json here and there will not be one: the site is
# hand-authored HTML and CSS served as-is, so the Node path's first step - find
# a lockfile - would fail with nothing to fix. The reusable workflow carries
# this path precisely so a repository without a package manager can still have
# a gate.
#
# `check-name` is `static-site`, so the check reports as `ci / static-site`.
# That string is what branch protection matches on. It replaced
# `ci / scaffolding`, and the protection rule was re-pointed in the same
# sitting - a required check that no longer reports blocks every merge instead
# of gating them.
#
# One command, deliberately. `tests/check.sh` is where the checks live, so
# adding one is a change to the script rather than to this file, and the same
# command runs here and on a contributor's machine. If the script is missing or
# unreadable the command fails, which is the behaviour we want: a gate that
# cannot find its tests is not a gate that passes.
#
# The tripwire that used to live here is gone, and it should be. It existed to
# fail the moment product code landed on a repository whose gate tested
# nothing. Product code has landed and the gate now tests it, so the tripwire
# has done its job. What replaces its guarantee is the script: every acceptance
# criterion that can be checked mechanically is checked there, and a page added
# without a check for it is a gap in `tests/check.sh` to close, not a gap here.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: chamaya00/agent-factory/.github/workflows/ci.yml@v1.14.0
    with:
      check-name: 'static-site'
      commands: |
        bash tests/check.sh
