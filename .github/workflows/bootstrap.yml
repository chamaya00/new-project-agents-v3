# default branch: it creates the ten labels and reports the exact check names
# to put in the branch protection rule.
#
# workflow_dispatch only. Nothing about this should happen automatically.
#
# Pinned to a release by commit SHA, like the other callers. See ci.yml for why.

on:
  workflow_dispatch:

jobs:
  bootstrap:
    uses: chamaya00/agent-factory/.github/workflows/bootstrap.yml@3151094081a7059a4f469b2742fccc57530197aa # v1.24.0
