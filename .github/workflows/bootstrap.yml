# default branch: it creates the nine labels and reports the exact check names
# to put in the branch protection rule.
#
# workflow_dispatch only. Nothing about this should happen automatically.
#
# Pinned to a release by commit SHA, like the other callers. See ci.yml for why.

on:
  workflow_dispatch:

jobs:
  bootstrap:
    uses: chamaya00/agent-factory/.github/workflows/bootstrap.yml@13948257a2f59f0ac00bac54a7d345efc1edd817 # v1.18.0
